version: '3.9'

services:
  api:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.api
    ports:
      - "8000:8000"
    env_file:
      - apps/api/.env
    volumes:
      - ./apps/api/src:/app/src
    networks:
      - horizon-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  web:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.web
    ports:
      - "3000:80"
    depends_on:
      - api
    networks:
      - horizon-network

networks:
  horizon-network:
    driver: bridge
